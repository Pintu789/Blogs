<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Hindi Tips - सभी ब्लॉग्स</title>
    <meta name="description" content="Tech Hindi Tips पर एंड्रॉइड और स्मार्टफोन से जुड़ी बेहतरीन टेक्निकल गाइड्स पढ़ें।">
    <style>
        :root {
            --primary-color: #1a73e8;
            --text-color: #333;
            --bg-color: #f8f9fa;
            --card-bg: #fff;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--primary-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        header p {
            margin: 5px 0 0;
            font-size: 14px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .post-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .post-card:hover {
            transform: translateY(-3px);
        }
        .blog-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .post-content {
            padding: 20px;
        }
        .post-content h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .post-content h2 a {
            text-decoration: none;
            color: var(--primary-color);
        }
        .post-content h2 a:hover {
            text-decoration: underline;
        }
        .read-more {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tech Hindi Tips</h1>
        <p>स्मार्टफोन और तकनीक से जुड़े आसान समाधान</p>
    </header>

    <div class="container" id="blogs-container">
        <!-- JavaScript यहाँ अपने आप सारे ब्लॉग्स लोड कर देगी -->
    </div>

    <footer>
        <p>&copy; 2026 Tech Hindi Tips. सभी अधिकार सुरक्षित हैं।</p>
    </footer>

    <!-- यहाँ posts.js फाइल को जोड़ा गया है -->
    <script src="posts.js"></script>
    <script>
        const container = document.getElementById("blogs-container");
        
        // loop चलाकर सभी ब्लॉग्स को होम पेज पर दिखाना
        blogPosts.forEach(post => {
            const card = document.createElement("div");
            card.className = "post-card";
            card.innerHTML = `
                <img src="${post.image}" alt="${post.title}" class="blog-image">
                <div class="post-content">
                    <h2><a href="${post.link}">${post.title}</a></h2>
                    <p>${post.description}</p>
                    <a href="${post.link}" class="read-more">पूरा पढ़ें &raquo;</a>
                </div>
            `;
            container.appendChild(card);
        });
    </script>

</body>
</html>
